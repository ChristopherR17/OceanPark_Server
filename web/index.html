<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Park</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script src="qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Press Start 2P', monospace;
            background-color: #101020;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            image-rendering: pixelated;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url("media/bg/oceanpark-bg.png");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            image-rendering: pixelated;
        }

        .bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    to bottom,
                    rgba(10, 10, 25, 0.35),
                    rgba(10, 10, 25, 0.75)
                );
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            padding: 24px;
        }

        .title-box {
            text-align: center;
        }

        .title-box h1 {
            font-size: clamp(1.2rem, 4vw, 2.4rem);
            color: #f2f2ff;
            text-shadow:
                3px 3px 0 #1d2747,
                6px 6px 0 #050510;
            letter-spacing: 3px;
            line-height: 1.6;
        }

        .title-box .subtitle {
            font-size: clamp(0.55rem, 1.5vw, 0.85rem);
            color: #9fb6e8;
            margin-top: 12px;
            letter-spacing: 4px;
        }

        .qr-panel {
            background: #e8edf7;
            border: 4px solid #26324f;
            box-shadow:
                0 0 0 4px #e8edf7,
                0 0 0 8px #26324f,
                8px 8px 0 8px #080812;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .qr-label {
            font-size: 0.5rem;
            color: #26324f;
            letter-spacing: 2px;
        }

        #qrcode canvas,
        #qrcode img {
            display: block;
            image-rendering: pixelated;
        }

        .qr-url {
            font-size: 0.35rem;
            color: #3b486d;
            text-align: center;
            max-width: 260px;
            word-break: break-all;
            line-height: 1.8;
        }

        .ground {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 32px;
            background: repeating-linear-gradient(
                90deg,
                #1d2747 0px,
                #1d2747 16px,
                #2f3f68 16px,
                #2f3f68 32px
            );
            border-top: 4px solid #e8edf7;
            z-index: 5;
        }
    </style>
</head>

<body>

    <div class="bg"></div>

    <div class="content">
        <div class="title-box">
            <h1>OCEAN PARK</h1>
            <p class="subtitle">ESCANEA Y DESCARGA</p>
        </div>

        <div class="qr-panel">
            <span class="qr-label">[ ESCANEA AQUÍ ]</span>
            <div id="qrcode"></div>
            <p class="qr-url">IETI</p>
        </div>
    </div>

    <div class="ground"></div>

    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "https://agora.xtec.cat/iesesteveterradas/",
            width: 220,
            height: 220,
            colorDark: "#26324f",
            colorLight: "#e8edf7",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>

</body>
</html>
